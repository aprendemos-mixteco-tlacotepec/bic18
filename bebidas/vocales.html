  <style>
    /* =====================================
       🎓 ESTILO ESCOLAR
    ======================================*/
    :root{
      --accent:#c28006;
      --accent-soft:#1cced4;
      --bg:#f7d9a2;
      --card:#ffffff;
      --text:#1a1a1a;
      --muted:#6b7280;
      --green:#27ae60;
    }
    
    *{
      box-sizing:border-box;
      user-select:none;
    }

    body{
      margin:0;
      background:var(--bg);
      font-family:'Nunito', system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      color:var(--text);
    }

    /* Header */
    header{
      background:#70ece2;
      border-bottom:2px solid #ffffff;
      padding:15px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

      height:70px;

      border-radius:6px;
      border:2px solid #d6e9ff;
    }

      font-size:20px;
      font-weight:70;

      text-shadow:0 1px 0 rgb(153, 105, 43);
    }

    .page-title{
      text-align:center;
      margin:20px 0;
      font-size:32px;
      color:var(--accent);
      font-weight:800;
    }

    /* Tarjetas */
    main{
      max-width:1050px;
      margin:auto;
      padding:20px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
      gap:16px;
    }
    body{
  background:#fefae0;
}

header{
  background:#588157;
}

.page-title{

}

.card{

  border:2px solid #dad7cd;
}

.btn{

}
    
    .card{
      background:var(--card);
      border:2px solid #ddebff;
      padding:14px;
      border-radius:12px;
      box-shadow:2px 4px 0 #accbff;
      transition:.25s;
    }

    .card:hover{
      transform:translate(-3px,-3px);
      box-shadow:6px 8px 0 #83afff;
    }

    .card img{
      width:100%;
      height:150px;
      object-fit:cover;
      border-radius:6px;
      border:2px solid #dcebff;
    }
    .card{
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,.2);
}

    .mixteco{
      font-weight:900;
      font-size:18px;
      margin-top:6px;
    }

    .spanish{
      font-size:14px;
      color:var(--muted);
    }

    .btn{
  background:linear-gradient(135deg,#d8d8d8,#a3b18a); /* color pro */
  border:none;
  padding:10px 20px; /* 🔥 tamaño más grande */
  color:white;
  font-weight:700;
  font-size:18px; /* 🔥 texto más grande */
  border-radius:12px;
  cursor:pointer;
  box-shadow:0 6px 15px rgba(0,0,0,.3);
  transition:.2s;
}
    .btn:hover{
      background:#003b7a;
    }

    .btn.secondary{
      background:white;
      border:2px solid var(--accent);
      color:var(--accent);
    }

   #juego-velocidad{
text-align:center;
margin-top:60px;
padding:20px;
background:#eef6ff;
border-radius:12px;
box-shadow:0 6px 15px rgba(0,0,0,.15);
}

#palabra-mixteco{
font-size:30px;
color:#1e3a8a;
margin:20px;
font-weight:900;
}

#imagenes-juego{
display:grid;
grid-template-columns:repeat(2,160px);
gap:20px;
justify-content:center;
}

.img-opcion{
width:160px;
height:160px;
object-fit:cover;
border-radius:12px;
cursor:pointer;
border:4px solid transparent;
transition:.25s;
}

.img-opcion:hover{
transform:scale(1.1);
}

.correcta{
border-color:#27ae60;
}

.incorrecta{
border-color:#e74c3c;
}

#reiniciar{
margin-top:20px;
padding:10px 20px;
background:#1e3a8a;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:700;
}
#barra-tiempo{
width:300px;
height:20px;
background:#ddd;
margin:10px auto;
border-radius:10px;
overflow:hidden;
}

#progreso{
height:100%;
width:100%;
background:#27ae60;
transition:width 1s linear;
}
/* =====================
   MEMORAMA
===================== */

#memorama{
margin-top:60px;
text-align:center;
padding:20px;
background:white;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.15);
}

#info-memo{
display:flex;
justify-content:center;
gap:30px;
margin-bottom:20px;
font-size:18px;
font-weight:bold;
}

#tablero{
display:grid;
grid-template-columns:repeat(4,140px);
gap:15px;
justify-content:center;
}

.carta{
width:140px;
height:140px;
cursor:pointer;
position:relative;
transform-style:preserve-3d;
transition:.6s;
}

.carta.volteada{
transform:rotateY(180deg);
}

.frente,
.atras{
position:absolute;
width:100%;
height:100%;
border-radius:12px;
backface-visibility:hidden;
display:flex;
align-items:center;
justify-content:center;
font-weight:900;
font-size:20px;
}

.frente{
background:#588157;
color:white;
}

.atras{
background:white;
border:3px solid #588157;
transform:rotateY(180deg);
overflow:hidden;
}

.atras img{
width:100%;
height:100%;
object-fit:cover;
}

@media(max-width:700px){

#tablero{
grid-template-columns:repeat(3,100px);
}

.carta{
width:100px;
height:100px;
}
}
  </style>
</head>

<script>
  // ===========================
  // 🟦 AUDIO REPRODUCTOR
  // ===========================
  function playAudio(btn){
  const card = btn.closest(".card");
  const audio = card.querySelector("audio");

  document.querySelectorAll("audio").forEach(a=>{
    if(a!==audio){
      a.pause();
      a.currentTime=0;
    }
  });

  audio.currentTime=0;
  audio.play();
}
;
</script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>

const cartasMixteco = [

{
id:1,
texto:"Jiki",
img:"imagen/puño.webp"
},

{
id:2,
texto:"Ko'o",
img:"imagen/plato.webp"
},

{
id:3,
texto:"Li'li",
img:"imagen/gallo.jpg"
},

{
id:4,
texto:"Savi",
img:"imagen/lluvia.jpg"
},

{
id:5,
texto:"Ve'e",
img:"imagen/casa.avif"
},

{
id:6,
texto:"Yiki",
img:"imagen/hueso.jpg"
}

];

let cartasJuego=[];
let primera=null;
let segunda=null;
let bloqueo=false;
let movimientos=0;
let pares=0;

const tablero=document.getElementById("tablero");

function iniciarMemorama(){

tablero.innerHTML="";
cartasJuego=[];

cartasMixteco.forEach(c=>{

cartasJuego.push({
tipo:"texto",
id:c.id,
contenido:c.texto
});

cartasJuego.push({
tipo:"imagen",
id:c.id,
contenido:c.img
});

});

cartasJuego.sort(()=>Math.random()-0.5);

cartasJuego.forEach(carta=>{

const div=document.createElement("div");

div.className="carta";

div.dataset.id=carta.id;

div.innerHTML=`
<div class="frente">?</div>
<div class="atras">
${carta.tipo==="texto"
? carta.contenido
: `<img src="${carta.contenido}">`
}
</div>
`;

div.addEventListener("click",()=>voltear(div));

tablero.appendChild(div);

});

}

function voltear(carta){

if(
bloqueo ||
carta===primera ||
carta.classList.contains("acertada")
)return;

carta.classList.add("volteada");

if(!primera){

primera=carta;
return;

}

segunda=carta;
movimientos++;

document.getElementById("movimientos").textContent=movimientos;

if(
primera.dataset.id===segunda.dataset.id
){

primera.classList.add("acertada");
segunda.classList.add("acertada");

pares++;

document.getElementById("pares").textContent=pares;

primera=null;
segunda=null;

if(pares===6){

confetti({
particleCount:300,
spread:180
});

setTimeout(()=>{
alert("🎉 ¡Felicidades! Completaste el memorama.");
},500);

}

}else{

bloqueo=true;

setTimeout(()=>{

primera.classList.remove("volteada");
segunda.classList.remove("volteada");

primera=null;
segunda=null;
bloqueo=false;

},900);

}

}

document.getElementById("reiniciarMemo")
.addEventListener("click",()=>{

movimientos=0;
pares=0;

document.getElementById("movimientos").textContent=0;
document.getElementById("pares").textContent=0;

iniciarMemorama();

});

iniciarMemorama();

</script>
