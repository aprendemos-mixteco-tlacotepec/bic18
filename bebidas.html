       🎓 ESTILO ESCOLAR

    :root{

    /* Tarjetas */
    main{

      padding:20px;
    }
    .grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(240px,1fr));

    }

    .card{

    .card:hover{

    }

    .card img{

      border-radius:6px;

    }

}

.card:hover{

    .mixteco{

    .spanish{

    .btn{

    .btn:hover{

<script>
  // ===========================
  // 🟦 AUDIO REPRODUCTOR
  // ===========================
  function playAudio(btn){
  const card = btn.closest(".card");
  const audio = card.querySelector("audio");

  document.querySelectorAll("audio").forEach(a=>{
    if(a!==audio){
      a.pause();
      a.currentTime=0;
    }
  });

  audio.currentTime=0;
  audio.play();
}
;
</script>
